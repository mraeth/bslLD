name: Docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - uses: julia-actions/cache@v2

      - name: Install Python dependencies
        run: pip install nbconvert jupyter

      - name: Install IJulia and register kernel
        run: |
          julia -e '
            using Pkg
            Pkg.add("IJulia")
            using IJulia
            # Register with the spec name that the notebooks expect
            IJulia.installkernel("Julia"; specname="julia-1.12")
          '

      - name: Instantiate examples environment
        run: |
          julia --project=examples -e '
            using Pkg
            Pkg.develop(path=".")
            Pkg.instantiate()
          '

      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'

      - name: Build docs (convert + execute notebooks, then makedocs)
        env:
          NBCONVERT: jupyter-nbconvert
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GKSwstype: "nul"
        run: julia --project=docs docs/make.jl

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
